<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANTIP Account - Tax & Accounting Schedule</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --gradient-start: #3b82f6;
            --gradient-end: #8b5cf6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Sarabun', 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #94a3b8;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            animation: fadeIn 1s ease-out;
        }

        @media (max-width: 992px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .section-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .section-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #e2e8f0;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 1rem;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .task-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .task-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--primary);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .task-item:hover::before {
            opacity: 1;
        }

        .task-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .task-date {
            font-size: 0.9rem;
            font-weight: 600;
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            display: inline-block;
            margin-bottom: 0.5rem;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
        }

        .task-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f1f5f9;
        }

        .task-desc {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 0.25rem;
            line-height: 1.4;
        }

        .task-status {
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            white-space: nowrap;
        }

        .status-done { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .status-urgent { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .status-pending { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .status-future { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }

        .task-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1rem;
            margin-top: 0.5rem;
        }

        .btn {
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 0.75rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-export {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-export:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
            filter: brightness(1.1);
        }

        .btn-export:active {
            transform: translateY(0);
        }
        
        .btn-disabled {
            background: rgba(255, 255, 255, 0.1);
            color: #64748b;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            padding: 2.5rem;
            max-width: 500px;
            width: 90%;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
        
        .modal-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-icon {
            font-size: 3.5rem;
            color: var(--success);
            margin-bottom: 1.5rem;
            display: inline-block;
        }
        
        .modal-icon.loading {
            color: var(--primary);
            animation: spin 1s linear infinite;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: white;
        }

        .modal-desc {
            color: #94a3b8;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .modal-close {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        /* Highlight specific text */
        .highlight {
            color: #60a5fa;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Tax & Accounting Dashboard</h1>
            <p class="subtitle">ระบบจัดการปฏิทินภาษีและงานบัญชี MANTIP</p>
        </header>

        <div class="dashboard-grid">
            
            <!-- Monthly Tasks -->
            <div class="section-card">
                <h2 class="section-title"><i class="fa-solid fa-calendar-day"></i> รายการประจำเดือน (ส.ค.)</h2>
                <div class="task-list" id="monthly-tasks">
                    <!-- Tasks will be rendered here by JS -->
                </div>
            </div>

            <!-- Annual Tasks -->
            <div class="section-card">
                <h2 class="section-title"><i class="fa-solid fa-calendar-check"></i> งานประจำปี</h2>
                <div class="task-list" id="annual-tasks">
                    <!-- Tasks will be rendered here by JS -->
                </div>
            </div>

        </div>
    </div>

    <!-- Export Modal -->
    <div class="modal-overlay" id="exportModal">
        <div class="modal-content">
            <div class="modal-icon" id="modalIcon">
                <i class="fa-solid fa-circle-notch loading"></i>
            </div>
            <h3 class="modal-title" id="modalTitle">กำลังเตรียมไฟล์...</h3>
            <p class="modal-desc" id="modalDesc">ระบบกำลังรวบรวมข้อมูลเพื่อสร้างไฟล์สำหรับนำส่งกรมสรรพากร</p>
            <button class="modal-close" onclick="closeModal()" id="modalCloseBtn" style="display: none;">ปิดหน้าต่าง</button>
        </div>
    </div>

    <script>
        const tasks = {
            monthly: [
                {
                    id: 'm1',
                    date: '7 ส.ค.',
                    title: 'ยื่นเอกสารให้สำนักงานบัญชี',
                    desc: 'ส่งใบกำกับภาษีซื้อ/ขาย, สลิปเงินเดือน, Statement ของเดือน ก.ค.',
                    status: 'done',
                    statusText: '✅ ดำเนินการแล้ว',
                    exportable: false
                },
                {
                    id: 'm2',
                    date: '15 ส.ค.',
                    title: 'ส่งประกันสังคม (สปส.1-10)',
                    desc: 'นำส่งเงินสมทบ ≈฿6,000 ของเดือน ก.ค.',
                    status: 'urgent',
                    statusText: '⏳ เหลืออีก 2 วัน',
                    exportable: true,
                    exportType: 'sso'
                },
                {
                    id: 'm3',
                    date: '15 ส.ค.',
                    title: 'ส่ง ภ.ง.ด.1',
                    desc: 'ภาษีหัก ณ ที่จ่าย เงินเดือนพนักงาน ของเดือน ก.ค.',
                    status: 'urgent',
                    statusText: '⏳ เหลืออีก 2 วัน',
                    exportable: true,
                    exportType: 'pnd1'
                },
                {
                    id: 'm4',
                    date: '15 ส.ค.',
                    title: 'ส่ง ภ.ง.ด.3/53',
                    desc: 'ภาษีหัก ณ ที่จ่าย ค่าเช่า ≈฿1,000 ของเดือน ก.ค.',
                    status: 'urgent',
                    statusText: '⏳ เหลืออีก 2 วัน',
                    exportable: true,
                    exportType: 'pnd3_53'
                },
                {
                    id: 'm5',
                    date: '23 ส.ค.',
                    title: 'ส่ง ภ.พ.30 (VAT)',
                    desc: 'สรุป VAT ขาย - VAT ซื้อ ของเดือน ก.ค.',
                    status: 'pending',
                    statusText: '📅 เหลืออีก 10 วัน',
                    exportable: true,
                    exportType: 'vat'
                }
            ],
            annual: [
                {
                    id: 'a1',
                    date: '28 ก.พ.',
                    title: 'ยื่น ภ.ง.ด.1ก',
                    desc: 'สรุปเงินเดือนพนักงานทุกคนทั้งปี',
                    status: 'future',
                    statusText: 'เตรียมตัว',
                    exportable: true,
                    exportType: 'pnd1k'
                },
                {
                    id: 'a2',
                    date: '31 มี.ค. / 8 เม.ย.',
                    title: 'ยื่น ภ.ง.ด.90/91 (บุคคล)',
                    desc: 'ภาษีเงินได้บุคคลธรรมดาของพ่อ, แม่, โอปอ, เต้ย (ยื่นออนไลน์ได้ถึง 8 เม.ย.)',
                    status: 'future',
                    statusText: 'เตรียมตัว',
                    exportable: true,
                    exportType: 'pnd90'
                },
                {
                    id: 'a3',
                    date: '30 เม.ย.',
                    title: 'จัดประชุม AGM',
                    desc: 'ประชุมใหญ่สามัญผู้ถือหุ้น ภายใน 30 เม.ย.',
                    status: 'future',
                    statusText: 'เตรียมตัว',
                    exportable: false
                },
                {
                    id: 'a4',
                    date: '31 พ.ค.',
                    title: 'ส่งงบการเงิน + ยื่น ภ.ง.ด.50',
                    desc: 'ส่งให้กรมพัฒนาธุรกิจการค้า และสรรพากร',
                    status: 'future',
                    statusText: 'เตรียมตัว',
                    exportable: true,
                    exportType: 'pnd50'
                },
                {
                    id: 'a5',
                    date: '31 ส.ค.',
                    title: 'ยื่น ภ.ง.ด.51',
                    desc: 'ภาษีนิติบุคคลครึ่งปี (ม.ค.-มิ.ย.)',
                    status: 'pending',
                    statusText: '⏳ กำลังจะถึง',
                    exportable: true,
                    exportType: 'pnd51'
                }
            ]
        };

        function renderTasks() {
            const monthlyContainer = document.getElementById('monthly-tasks');
            const annualContainer = document.getElementById('annual-tasks');

            monthlyContainer.innerHTML = tasks.monthly.map(task => createTaskHTML(task)).join('');
            annualContainer.innerHTML = tasks.annual.map(task => createTaskHTML(task)).join('');
        }

        function createTaskHTML(task) {
            let exportBtn = '';
            if (task.exportable) {
                exportBtn = `<button class="btn btn-export" onclick="handleExport('${task.title}', '${task.exportType}')">
                                <i class="fa-solid fa-file-export"></i> EXPORT ส่งสรรพากร
                             </button>`;
            } else if (task.status === 'done') {
                exportBtn = `<button class="btn btn-disabled" disabled>
                                <i class="fa-solid fa-check"></i> เสร็จสิ้น
                             </button>`;
            }

            return `
                <div class="task-item">
                    <div class="task-header">
                        <div>
                            <span class="task-date">${task.date}</span>
                            <div class="task-title">${task.title}</div>
                        </div>
                        <span class="task-status status-${task.status}">${task.statusText}</span>
                    </div>
                    <div class="task-desc">${task.desc}</div>
                    ${exportBtn ? `<div class="task-actions">${exportBtn}</div>` : ''}
                </div>
            `;
        }

        function handleExport(title, type) {
            const modal = document.getElementById('exportModal');
            const icon = document.getElementById('modalIcon');
            const modalTitle = document.getElementById('modalTitle');
            const modalDesc = document.getElementById('modalDesc');
            const closeBtn = document.getElementById('modalCloseBtn');

            // Reset modal state
            icon.innerHTML = '<i class="fa-solid fa-circle-notch loading"></i>';
            modalTitle.innerText = `กำลังสร้างไฟล์ ${title}...`;
            modalDesc.innerHTML = `ระบบกำลังเตรียมไฟล์ข้อมูลตามรูปแบบของ <span class="highlight">กรมสรรพากร / e-Filing</span><br>กรุณารอสักครู่...`;
            closeBtn.style.display = 'none';
            
            modal.classList.add('active');

            // Simulate API request/file generation
            setTimeout(() => {
                icon.innerHTML = '<i class="fa-solid fa-circle-check" style="animation: none;"></i>';
                modalTitle.innerText = 'สร้างไฟล์สำเร็จ!';
                modalDesc.innerHTML = `ไฟล์ข้อมูล <span class="highlight">${title}</span> พร้อมสำหรับอัปโหลดเข้าสู่ระบบ e-Filing ของกรมสรรพากรแล้ว`;
                closeBtn.style.display = 'block';

                // Create a mock text/csv file to download
                downloadMockFile(type);
            }, 2000);
        }

        function downloadMockFile(type) {
            const date = new Date().toISOString().split('T')[0];
            let content = "";
            let filename = "";

            switch(type) {
                case 'pnd1':
                    content = "0105555555555|00000|01|2569|...|PND1 Format";
                    filename = `PND1_${date}.txt`;
                    break;
                case 'pnd3_53':
                    content = "0105555555555|00000|03|2569|...|PND3/53 Format";
                    filename = `PND3_53_${date}.txt`;
                    break;
                case 'vat':
                    content = "TaxInvoice,Date,Amount,VAT\nINV001,2026-08-01,1000,70";
                    filename = `PP30_VAT_${date}.csv`;
                    break;
                case 'sso':
                    content = "SSO_Format|Company|Amount";
                    filename = `SSO_1_10_${date}.txt`;
                    break;
                default:
                    content = `Mock data for ${type}`;
                    filename = `Export_${type}_${date}.txt`;
            }

            const blob = new window.Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), content], {type: 'text/csv;charset=utf-8;'});
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
        }

        function closeModal() {
            document.getElementById('exportModal').classList.remove('active');
        }

        // Initialize
        renderTasks();
    </script>
    <!-- Floating Navigation Button -->
    <a href="mantip_erp_dashboard.html" style="position: fixed; bottom: 30px; right: 30px; background-color: #4f46e5; color: white; padding: 12px 24px; border-radius: 50px; text-decoration: none; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4); font-family: 'Inter', 'Prompt', sans-serif; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; z-index: 9999; transition: all 0.3s ease;" onmouseover="this.style.transform='translateY(-3px)'; this.style.boxShadow='0 6px 16px rgba(79, 70, 229, 0.6)';" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 12px rgba(79, 70, 229, 0.4)';">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L8 2.207l6.646 6.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293z"/><path d="m8 3.293 6 6V13.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 13.5V9.293z"/></svg>
        เมนูหลัก (Main Menu)
    </a>
</body>
</html>
